<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cálculo IMC</title>
    <link rel="stylesheet" href="imc.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <form>
      <div class="imc-container">
        <h1>Calcular IMC</h1>

        <div class="input-group">
        <label for="altura">Altura (m): </label>
        <input type="number" name="altura" id="altura" step="0.01" placeholder="Ex: 1,75" />
      </div>
      <div class="input-group">
        <label for="peso">Peso (kg): </label>
        <input type="number" name="peso" id="peso" step="0.01" placeholder="Ex: 70,5" />
      </div>

        <h3>Seu IMC é:</h3>
        <button type="button" class="btn-solid theme-accent" onclick="calcularIMC()">
        Calcular
      </button>
      </div>
    </form>
    <script src="imc.js"></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
